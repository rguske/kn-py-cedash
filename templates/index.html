<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ display_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly.min.css">
    <style>
        :root {
            --cedash-purple: #6f2da8;
            --cedash-purple-dark: #4a1d73;
            --cedash-purple-light: #a06cd5;
        }
        html {
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            font-size: 16px;
        }
        .pf-v6-l-bullseye {
            height: 100vh;
            padding: var(--pf-t--global--spacer--lg);
            box-sizing: border-box;
        }
        .cedash-card {
            max-width: 900px;
            width: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .pf-v6-c-card.cedash-card {
            --pf-v6-c-card--BackgroundColor: rgba(30, 30, 30, 0.95);
            border: 2px solid var(--cedash-purple);
            box-shadow: 0 0 40px rgba(111, 45, 168, 0.35);
            overflow: hidden;
        }
        .cedash-header {
            text-align: center;
            padding: var(--pf-t--global--spacer--xl) 0;
            background: linear-gradient(180deg, rgba(111, 45, 168, 0.15) 0%, transparent 100%);
            border-radius: var(--pf-t--global--border--radius--medium) var(--pf-t--global--border--radius--medium) 0 0;
            flex-shrink: 0;
        }
        .cedash-title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--pf-t--global--spacer--md);
        }
        .cedash-logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 12px rgba(111, 45, 168, 0.6));
        }
        .cedash-title {
            font-size: 2.25rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 0 20px rgba(111, 45, 168, 0.6);
        }
        .cedash-subtitle {
            color: #cccccc;
            font-size: 1rem;
            margin-top: var(--pf-t--global--spacer--sm);
        }
        .pf-v6-c-card__body {
            color: #e0e0e0;
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
        }
        .cedash-event-card {
            background: rgba(111, 45, 168, 0.08);
            border-left: 3px solid var(--cedash-purple);
            border-radius: var(--pf-t--global--border--radius--medium);
            padding: var(--pf-t--global--spacer--md);
            margin-bottom: var(--pf-t--global--spacer--md);
        }
        .cedash-event-card h3 {
            color: var(--cedash-purple-light) !important;
            font-size: 1.1rem;
            margin: 0 0 var(--pf-t--global--spacer--xs) 0;
        }
        .cedash-event-meta {
            color: #aaaaaa;
            font-size: 0.85rem;
            margin-bottom: var(--pf-t--global--spacer--sm);
        }
        .cedash-event-meta span {
            margin-right: var(--pf-t--global--spacer--md);
        }
        .cedash-event-data {
            background: rgba(0, 0, 0, 0.35);
            color: #e0e0e0;
            padding: var(--pf-t--global--spacer--sm);
            border-radius: var(--pf-t--global--border--radius--small);
            overflow-x: auto;
            font-size: 0.85rem;
            margin: 0;
        }
        .cedash-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: var(--pf-t--global--spacer--sm) 0 var(--pf-t--global--spacer--xs) 0;
        }
        .cedash-event-data + .cedash-section-header {
            margin-top: var(--pf-t--global--spacer--md);
        }
        .cedash-section-label {
            color: var(--cedash-purple-light);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }
        .cedash-copy-btn {
            background: rgba(111, 45, 168, 0.15);
            color: var(--cedash-purple-light);
            border: 1px solid var(--cedash-purple);
            border-radius: var(--pf-t--global--border--radius--small);
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.4;
            padding: 2px 10px;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .cedash-copy-btn:hover {
            background: var(--cedash-purple);
            color: #ffffff;
        }
        .cedash-copy-btn:active {
            background: var(--cedash-purple-dark);
        }
        .cedash-copy-btn--done {
            background: rgba(76, 175, 80, 0.25) !important;
            border-color: #4caf50 !important;
            color: #8ee6a1 !important;
        }
        .cedash-copy-btn--failed {
            background: rgba(220, 53, 69, 0.25) !important;
            border-color: #dc3545 !important;
            color: #f5a3ab !important;
        }
    </style>
</head>
<body>
    <div class="pf-v6-l-bullseye">
        <div class="pf-v6-c-card cedash-card">
            <div class="cedash-header">
                <div class="cedash-title-row">
                    <svg class="cedash-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="kn-py-cedash logo">
                        <rect x="3" y="3" width="58" height="58" rx="14" fill="#4a1d73" stroke="#a06cd5" stroke-width="3"/>
                        <svg x="11" y="18" width="42" height="28" viewBox="-2.78 54.22 365.56 245.56" preserveAspectRatio="xMidYMid meet">
                            <g transform="translate(48 69)" fill="#ffffff">
                                <path d="M219.246 198.341c26.572.001 55.443-17.497 61.933-43.466 7.451-29.82-10.013-60.551-39.311-69.135-5.606-1.642-11.362-2.176-17.184-2.167-8.557.014-17.114.004-25.902.004.598-21.86-7.116-39.902-24.405-53.336-11.024-8.567-23.716-12.575-37.607-12.128-15.736.506-29.325 6.452-40.487 17.65C85.15 46.93 79.339 60.593 78.286 76.006l-24.08-8.315C56.35 41.089 77.846 4.345 119.513-5.3c47.529-11.003 91.576 20.022 101.913 63.662 3.951 0 8.061-.389 12.077.062C265.767 62.043 288.65 79 301.405 108.81c15.76 36.835 2.371 80.218-30.54 101.795-13.68 8.97-35.278 13.358-51.556 13.395"/>
                                <path d="M200.15 223.85s-39.04.289-71.17.065c-33.79-.235-61.053-21.921-69.473-51.402-7.312-25.6-1.444-48.533 16.123-68.474 11.178-12.687 25.044-20.82 41.818-23.711 28.282-4.876 56.748 7.754 71.982 32.01 9.835 15.659 13.52 32.685 10.882 51.03-.165 1.148-.433 1.757-1.794 1.754-22.819-.038-45.637-.028-68.456-.034-.321 0-.642-.07-1.134-.127-.04-.686-.107-1.324-.108-1.964-.007-7.032-.008-14.065-.002-21.098.002-2.854.314-3.152 3.222-3.152h41.219c-.363-1.13-.584-2.07-.956-2.944-6.755-15.885-18.64-25.76-35.647-28.59-17.05-2.84-31.939 2.207-43.14 15.521-17.225 20.476-11.832 53.086 10.776 67.821 7.787 5.076 16.3 7.596 25.617 7.587 31.8-.032 70.178-.007 70.178-.007l.064 25.714"/>
                                <path d="M45.066 192.514l15.765 19.942c-21.782 13.708-58.5 14.24-84.102-11.702-25.844-26.188-27.453-68.227-3.54-96.512 24.25-28.684 62.787-30.793 87.695-15.67l-15.817 19.964c-12.315-5.34-25.212-5.522-37.968.524-8.575 4.065-15.198 10.361-19.893 18.657-9.72 17.178-7.545 38.47 5.433 53.303 12.337 14.1 32.984 20.15 52.427 11.494"/>
                            </g>
                        </svg>
                    </svg>
                    <h1 class="cedash-title">{{ display_name }}</h1>
                </div>
                <p class="cedash-subtitle">Live CloudEvents dashboard</p>
            </div>
            <div class="pf-v6-c-card__body">
                <div id="events-list">
                    <div class="pf-v6-c-empty-state">
                        <div class="pf-v6-c-empty-state__content">
                            <p class="pf-v6-c-empty-state__body">Waiting for CloudEvents&hellip;</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pf-v6-c-card__footer" style="text-align:center; color:#888; font-size:0.85rem; flex-shrink:0;">
                <p>Showing up to 50 most recent events &middot; refreshes every 2.5s</p>
            </div>
        </div>
    </div>

    <script>
        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderEmptyState() {
            return (
                '<div class="pf-v6-c-empty-state">' +
                '<div class="pf-v6-c-empty-state__content">' +
                '<p class="pf-v6-c-empty-state__body">Waiting for CloudEvents&hellip;</p>' +
                '</div>' +
                '</div>'
            );
        }

        function renderEvent(evt) {
            const attrs = evt.attributes || {};
            const attrsJson = JSON.stringify(attrs, null, 2);
            const dataJson = JSON.stringify(evt.data, null, 2);
            return (
                '<div class="cedash-event-card">' +
                '<h3>' + escapeHtml(attrs.type || 'unknown type') + '</h3>' +
                '<div class="cedash-event-meta">' +
                '<span><strong>received:</strong> ' + escapeHtml(evt.received_at || '') + '</span>' +
                '</div>' +
                '<div class="cedash-section-header">' +
                '<p class="cedash-section-label">Attributes</p>' +
                '<button type="button" class="cedash-copy-btn" onclick="copyJsonBlock(this)">Copy</button>' +
                '</div>' +
                '<pre class="cedash-event-data">' + escapeHtml(attrsJson) + '</pre>' +
                '<div class="cedash-section-header">' +
                '<p class="cedash-section-label">Data</p>' +
                '<button type="button" class="cedash-copy-btn" onclick="copyJsonBlock(this)">Copy</button>' +
                '</div>' +
                '<pre class="cedash-event-data">' + escapeHtml(dataJson) + '</pre>' +
                '</div>'
            );
        }

        async function copyJsonBlock(button) {
            const header = button.closest('.cedash-section-header');
            const pre = header ? header.nextElementSibling : null;
            const text = pre ? pre.textContent : '';
            const originalLabel = button.textContent;
            const resetAfter = (label, cssClass) => {
                button.textContent = label;
                button.classList.remove('cedash-copy-btn--done', 'cedash-copy-btn--failed');
                if (cssClass) {
                    button.classList.add(cssClass);
                }
                setTimeout(() => {
                    button.textContent = originalLabel;
                    button.classList.remove('cedash-copy-btn--done', 'cedash-copy-btn--failed');
                }, 1500);
            };

            const copyWithExecCommand = () => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(textarea);
                if (!ok) {
                    throw new Error('execCommand copy returned false');
                }
            };

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                    } catch (clipboardErr) {
                        console.warn('navigator.clipboard.writeText failed, falling back', clipboardErr);
                        copyWithExecCommand();
                    }
                } else {
                    copyWithExecCommand();
                }
                resetAfter('Copied!', 'cedash-copy-btn--done');
            } catch (err) {
                console.error('Failed to copy to clipboard', err);
                resetAfter('Failed', 'cedash-copy-btn--failed');
            }
        }

        async function refresh() {
            try {
                const res = await fetch('/api/events');
                const events = await res.json();
                const container = document.getElementById('events-list');
                const scrollRegion = container.parentElement;
                const previousScrollTop = scrollRegion ? scrollRegion.scrollTop : 0;
                container.innerHTML = events.length === 0
                    ? renderEmptyState()
                    : events.map(renderEvent).join('');
                if (scrollRegion) {
                    scrollRegion.scrollTop = previousScrollTop;
                }
            } catch (err) {
                console.error('Failed to refresh events', err);
            }
        }

        refresh();
        setInterval(refresh, 2500);
    </script>
</body>
</html>
